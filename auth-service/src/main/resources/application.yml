server:
  port: 8080

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USER}
    password: ${SMTP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USER:auth}
    password: ${DB_PASSWORD:auth}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-32chars-min}
    access-ttl-seconds: ${JWT_ACCESS_TTL:900}
    issuer: ${JWT_ISSUER:auth-service}

security-reset:
  ttl-seconds: ${RESET_TTL:900} # 15 minutes


app:
  mail:
    from: ${MAIL_FROM:${SMTP_USER}}
  front:
    base-url: ${FRONT_BASE_URL:http://localhost:4200}