<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auth Service - Test UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
    h1 { margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
    label { display:block; margin-top: 10px; font-size: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 12px; padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer; }
    pre { background: #f7f7f7; padding: 12px; border-radius: 10px; overflow:auto; }
    .row { display:flex; gap: 8px; align-items:center; }
    .row input { flex:1; }
    .ok { color: #0a7; font-weight: 700; }
    .ko { color: #c00; font-weight: 700; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Auth Service - Test UI</h1>
  <small>Teste /auth/register et /auth/login (email ou username).</small>

  <div class="grid" style="margin-top:16px;">
    <div class="card">
      <h2>Créer un compte</h2>

      <label>Email</label>
      <input id="regEmail" placeholder="test@mail.com" />

      <label>Username</label>
      <input id="regUsername" placeholder="axel" />

      <label>Mot de passe</label>
      <input id="regPassword" type="password" placeholder="password123" />

      <button onclick="register()">Register</button>

      <h3>Résultat</h3>
      <div id="regStatus"></div>
      <pre id="regOut">{}</pre>
    </div>

    <div class="card">
      <h2>Connexion</h2>

      <label>Identifier (email OU username)</label>
      <input id="loginIdentifier" placeholder="axel ou test@mail.com" />

      <label>Mot de passe</label>
      <input id="loginPassword" type="password" placeholder="password123" />

      <button onclick="login()">Login</button>

      <h3>Résultat</h3>
      <div id="loginStatus"></div>
      <pre id="loginOut">{}</pre>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2>Console</h2>
    <pre id="console"></pre>
    <button onclick="clearConsole()">Clear</button>
  </div>

<script>
  function log(msg) {
    const el = document.getElementById("console");
    el.textContent += msg + "\n";
    el.scrollTop = el.scrollHeight;
  }
  function clearConsole() {
    document.getElementById("console").textContent = "";
  }

  async function callJson(url, payload) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; }
    catch { data = { raw: text }; }

    return { ok: res.ok, status: res.status, data };
  }

  async function register() {
    const email = document.getElementById("regEmail").value;
    const username = document.getElementById("regUsername").value;
    const password = document.getElementById("regPassword").value;

    log("POST /auth/register " + JSON.stringify({email, username, password}));

    const r = await callJson("/auth/register", { email, username, password });

    document.getElementById("regStatus").innerHTML =
      r.ok ? `<span class="ok">OK (${r.status})</span>` : `<span class="ko">ERROR (${r.status})</span>`;

    document.getElementById("regOut").textContent = JSON.stringify(r.data, null, 2);

    // pré-remplir le login
    if (r.ok) {
      document.getElementById("loginIdentifier").value = username || email;
      document.getElementById("loginPassword").value = password;
    }
  }

  async function login() {
    const identifier = document.getElementById("loginIdentifier").value;
    const password = document.getElementById("loginPassword").value;

    log("POST /auth/login " + JSON.stringify({identifier, password}));

    const r = await callJson("/auth/login", { identifier, password });

    document.getElementById("loginStatus").innerHTML =
      r.ok ? `<span class="ok">OK (${r.status})</span>` : `<span class="ko">ERROR (${r.status})</span>`;

    document.getElementById("loginOut").textContent = JSON.stringify(r.data, null, 2);
  }
</script>
</body>
</html>
