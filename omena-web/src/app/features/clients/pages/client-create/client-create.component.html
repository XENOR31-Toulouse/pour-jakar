<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Création d'un client</h2>
    <button class="btn btn-outline-secondary" routerLink="/clients">
      <i class="fas fa-arrow-left"></i> Retour à la liste
    </button>
  </div>

  <div class="card">
    <div class="card-body">
      <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="name" class="form-label">Nom *</label>
            <input 
              type="text" 
              class="form-control" 
              id="name" 
              formControlName="name"
              [class.is-invalid]="clientForm.get('name')?.touched && clientForm.get('name')?.invalid">
            <div class="invalid-feedback" *ngIf="clientForm.get('name')?.touched && clientForm.get('name')?.invalid">
              <div *ngIf="clientForm.get('name')?.errors?.['required']">Le nom est requis.</div>
              <div *ngIf="clientForm.get('name')?.errors?.['minlength']">Le nom doit contenir au moins 2 caractères.</div>
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label for="email" class="form-label">Email *</label>
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              formControlName="email"
              [class.is-invalid]="clientForm.get('email')?.touched && clientForm.get('email')?.invalid">
            <div class="invalid-feedback" *ngIf="clientForm.get('email')?.touched && clientForm.get('email')?.invalid">
              <div *ngIf="clientForm.get('email')?.errors?.['required']">L'email est requis.</div>
              <div *ngIf="clientForm.get('email')?.errors?.['email']">Veuillez entrer un email valide.</div>
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label for="phoneNumber" class="form-label">Téléphone *</label>
            <input 
              type="text" 
              class="form-control" 
              id="phoneNumber" 
              formControlName="phoneNumber"
              [class.is-invalid]="clientForm.get('phoneNumber')?.touched && clientForm.get('phoneNumber')?.invalid">
            <div class="invalid-feedback" *ngIf="clientForm.get('phoneNumber')?.touched && clientForm.get('phoneNumber')?.invalid">
              <div *ngIf="clientForm.get('phoneNumber')?.errors?.['required']">Le numéro de téléphone est requis.</div>
              <div *ngIf="clientForm.get('phoneNumber')?.errors?.['minlength']">Le numéro de téléphone doit contenir au moins 5 caractères.</div>
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label for="address" class="form-label">Adresse</label>
            <input 
              type="text" 
              class="form-control" 
              id="address" 
              formControlName="address">
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <button 
            type="button" 
            class="btn btn-outline-secondary" 
            routerLink="/clients">
            Annuler
          </button>
          <button 
            type="submit" 
            class="btn btn-primary" 
            [disabled]="clientForm.invalid || isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span *ngIf="isLoading" class="visually-hidden">Chargement...</span>
            <span *ngIf="!isLoading">Créer le client</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
