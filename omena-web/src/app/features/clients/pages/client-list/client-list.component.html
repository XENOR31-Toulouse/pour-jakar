<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestion des Clients</h2>
    <button class="btn btn-primary" routerLink="/clients/create">
      <i class="fas fa-plus"></i> Ajouter un client
    </button>
  </div>

  <div class="card">
    <div class="card-body">
      <div *ngIf="isLoading" class="text-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Chargement...</span>
        </div>
      </div>

      <div *ngIf="!isLoading && clients.length === 0" class="text-center py-4">
        <p>Aucun client trouvé.</p>
      </div>

      <div *ngIf="!isLoading && clients.length > 0" class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Nom</th>
              <th>Email</th>
              <th>Téléphone</th>
              <th>Adresse</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let client of clients">
              <td>{{ client.name }}</td>
              <td>{{ client.email }}</td>
              <td>{{ client.phoneNumber }}</td>
              <td>{{ client.address }}</td>
              <td>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteClient(client.id)">
                  <i class="fas fa-trash"></i> Supprimer
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
