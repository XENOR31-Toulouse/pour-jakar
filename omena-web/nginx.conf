server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- AUTH SERVICE ---
  # Tout ce qui commence par /api/auth/ va vers auth-service
  location /api/auth/ {
    proxy_pass http://auth-service:8080/;  # <-- slash final IMPORTANT

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_intercept_errors off;
    proxy_buffering off;
  }

  # --- WORKSITE SERVICE ---
  # Tout ce qui commence par /api/site/ va vers worksite-service
  location /api/site/ {
    proxy_pass http://worksite-service:8080/;  # <-- slash final IMPORTANT

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_intercept_errors off;
    proxy_buffering off;
  }

  # SPA routing (doit rester en dernier)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
