services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./auth-service
      dockerfile: src/main/resources/docker/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USER: auth
      DB_PASSWORD: auth
      JWT_SECRET: "change-me-please-change-me-please-32chars-min"
      JWT_ACCESS_TTL: 900
      JWT_ISSUER: "auth-service"
    ports:
      - "8081:8080" # host:container
    depends_on:
      - db

  front-auth:
    build:
      context: ./front-auth
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - auth-service

volumes:
  auth_db_data:
